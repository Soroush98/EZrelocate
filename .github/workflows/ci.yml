name: CI

# Quality gate for the Apify actor: lint + offline smoke test (parsing, dedup,
# filters). Live-site checks (live_check.py, harness_e2e.py) and cloud runs are
# manual — they hit real sites and need proxies.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff (lint + import order)
        run: ruff check src tools *.py

      - name: Smoke test (offline)
        run: python test_smoke.py
